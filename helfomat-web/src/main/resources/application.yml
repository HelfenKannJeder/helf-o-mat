server:
  compression:
    enabled: true
    mime-types:
    - application/json
    - application/xml
    - text/html
    - text/xml
    - text/plain
  servlet:
    context-path: /

elasticsearch:
  index: helfomat
  type:
    organization: organization

googlemaps:
  api-key: ReplaceMe

helfomat.picture:
  picture-folder: pictures/
  picture-sizes:
  - name: icon
    width: 84
  - name: teaser
    width: 1000
    height: 300
  - name: medium
    width: 300

spring.servlet.multipart:
  max-file-size: 7MB
  max-request-size: 7MB

helfomat.recaptcha:
  # reCAPTCHA v3 answers `success` for any well formed token, bot or not. Only a score at or above
  # this threshold is accepted. Google suggests 0.5; watch the "Rejected captcha, score" warnings
  # before changing it.
  minimum-score: 0.5
  # Domains a token may be solved on, empty means the check is skipped. Set this per environment.
  allowed-hostnames: []

helfomat.contact-form.rate-limit:
  per-ip-limit: 5
  per-ip-window: 1h
  per-email-limit: 3
  per-email-window: 24h

security:
  keycloak:
    client:
      access-token-uri: ${keycloak.auth-server-url}/realms/master/protocol/openid-connect/token
      token-info-uri: ${keycloak.auth-server-url}/realms/master/protocol/openid-connect/token/introspect

logging:
  level:
    root: ERROR
    de.helfenkannjeder: DEBUG

spring:
  messages:
    basename: i18n/messages

  jpa:
    hibernate:
      ddl-auto: none